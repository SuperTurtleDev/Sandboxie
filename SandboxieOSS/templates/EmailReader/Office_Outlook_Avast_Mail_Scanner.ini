[Template]
Tmpl.Title=Office Outlook + avast! Mail Scanner
Tmpl.Class=EmailReader
Tmpl.Url=http://www.avast.com
Tmpl.Scan=s
Tmpl.ScanService=avast! Mail Scanner
OpenIpcPath=<Office_Outlook>,\RPC Control\[Aavm]
