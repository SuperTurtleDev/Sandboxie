OpenIpcPath=<Office_Outlook>,*\BaseNamedObjects*\AvSPM*
OpenIpcPath=<Office_Outlook>,*\BaseNamedObjects*\AvRes*
ProcessGroup=<Office_Outlook>,outlook.exe
