#
# Sandboxie Official Configuration Templates
#
# PLEASE DO NOT EDIT
#
# You may place local (custom) templates in your Sandboxie.ini
# file. Use the examples here to create your own templates, but
# do not copy the [TemplateSettings] section.
#
# Please name your own local templates in such a way that
# it will not introduce conflicts with the official templates.
#
# For example, if you design a local template to resolve
# a conflict with the utility ExampleSoft:
#
#     [Template_Local_ExampleSoft]
#     Tmpl.Title=ExampleSoft
#     Tmpl.Class=Local
#     OpenWinClass=ExampleSoft_WindowClass
#     OpenIpcPath=*\BaseNamedObjects*\ExampleSoft_*
#
# Note the use of the word "local" to prevent a conflict,
# should this official template file later be revised to
# include a template for ExampleSoft.
#
# Local templates that appear in your Sandboxie.ini are
# treated the same way as any official template in this file,
# and can be activated in the Sandboxie user interface.
#

# Sandboxie-OSS trimmed Templates.ini (V2 split 2026-09-28; refs
# dropped + evidence header 2026-09-28; residue purge 2026-09-30)
# Deployment principle (coordinator-ratified): templates\ = MIGRATED
# config (V2 tree), this file = UNMIGRATED residue + the startup
# skeleton the frozen 5.73.5 kernel reads from its home dir
# (core\drv\conf.c Conf_Read -> (Home)\Templates.ini).
# - [TemplateSettings] moved to templates\Basic.ini (user-space
#   variable source; no %Tmpl.% reference remains in this file).
# - 400 migrated templates removed; [DefaultTemplates] kept EMPTY:
#   its former 10 refs (RpcPortBindings/SpecialImages/COM/...) all
#   target migrated templates whose [Template_*] bodies are gone -
#   dead refs would emit SBIE1411 on every kernel config reload.
# - startup skeleton kept (kernel consumers in core\drv):
#   [TemplateDefaultPaths] default open/closed paths, incl.
#     OpenIpcPath=\KnownDlls\* - without it a boxed process dies
#     SBIE2112 OpenSection(\KnownDlls\kernel32.dll) => exit 127
#   [TemplateNetworkPaths]/[TemplateSModPaths]/[TemplatePModPaths]/
#   [TemplateAppCPaths] network/security/privacy/app-compartment
#     path sets (plus-type boxes need PMod/AppC: skeleton without
#     them -> app-plus exec rc=1; with them rc=7)
#   [TemplateDefaultFolders] folder redirects
#   [SysCallPresets] global syscall presets (syscall_util.c looks the
#     section name up directly via Conf_Get - NOT Template= activated;
#     global/driver-wide, so it cannot move to the V2 user-space tree)
# - residue purge 2026-09-30: the last 37 [Template_*] sections removed.
#   4 with content migrated to the V2 tree (Misc/HideInstalledPrograms,
#   System/OpenCOM, System/BoxedCOM, Misc/KnownConflicts); 33 empty
#   deprecated shells dropped. Terminal state: kernel skeleton only,
#   zero [Template_*] sections, zero Template= references.
# A/B evidence + reproducible commands: docs/05-build.md section 8.2.

[DefaultTemplates]


